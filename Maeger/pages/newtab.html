<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Yalb - New Tab</title>
    <style>
        body { background: #0a0a0a; color: #e0e0e0; font-family: "Segoe UI", sans-serif; padding: 40px; }
        .search { width: 100%; max-width: 760px; margin: 40px auto; }
        .search input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid #3a3a3e; background:#1e1e22; color:#e6e6e8; font-size:14px }
        .shortcuts { display:flex; gap:12px; flex-wrap:wrap; margin-top:24px; }
        .shortcut { background:#2e2e32; padding:12px 16px; border-radius:8px; min-width:120px; text-align:center; cursor:pointer }
        .time { font-size:28px; font-weight:300; margin-top:8px }
    </style>
</head>
<body>
    <div style="text-align:center; max-width:980px; margin:0 auto;">
        <div class="time" id="time">Loading...</div>
        <div class="search">
            <input id="addr" placeholder="Search or type a URL" />
        </div>
        <div class="shortcuts" id="shortcuts"></div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('time').textContent = now.toLocaleString();
        }
        setInterval(updateTime, 1000);
        updateTime();

        const shortcuts = [
            { title: 'GitHub', url: 'https://github.com' },
            { title: 'Google', url: 'https://www.google.com' },
            { title: 'YouTube', url: 'https://www.youtube.com' },
            { title: 'Reddit', url: 'https://www.reddit.com' }
        ];
        const sc = document.getElementById('shortcuts');
        shortcuts.forEach(s => {
            const el = document.createElement('div');
            el.className = 'shortcut';
            el.textContent = s.title;
            el.onclick = () => {
                if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage({ type: 'navigate', url: s.url });
                else window.location.href = s.url;
            };
            sc.appendChild(el);
        });

        const addr = document.getElementById('addr');
        addr.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const input = addr.value.trim();
                if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage({ type: 'navigate', url: input });
                else window.location.href = input;
            }
        });
    </script>
</body>
</html>
